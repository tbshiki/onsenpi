[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onsenpi"
version = "0.2.5"  # パフォーマンス最適化とユーザビリティ向上バージョン
description = "A Python library to simplify the use of Amazon Selling Partner API"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "tbshiki", email = "info@tbshiki.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",  # Python 3.12サポート追加
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",  # 型ヒントサポートを示す
]
keywords = ["onsenpi", "sp-api", "spapi", "amazon", "selling-partner-api"]
dependencies = [
    "python-amazon-sp-api>=1.0.0",
    "requests>=2.28.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",    # 静的型チェッカー
    "ruff>=0.1.0",    # オプションのリンティングツール
]

[project.urls]
"Homepage" = "https://github.com/tbshiki/onsenpi"
"Bug Tracker" = "https://github.com/tbshiki/onsenpi/issues"
"Documentation" = "https://github.com/tbshiki/onsenpi#readme"

[tool.setuptools]
packages = ["onsenpi"]
package-data = {"onsenpi" = ["py.typed"]}  # 型ヒントファイルを含める

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=onsenpi --cov-report=term --cov-report=html"
markers = [
    "slow: テストの実行に時間がかかるマーク (除外するには '-m \"not slow\"')",
    "integration: Amazon SP-APIと実際に通信するテスト (除外するには '-m \"not integration\"')"
]

[tool.coverage.run]
source = ["onsenpi"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError"
]

[tool.mypy]
python_version = "3.7"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.ruff]
# Ruffの設定をコメントで残すが、ユーザーが自由に設定できるように
# 実際の設定値は最小限にしておく
# ユーザーはオプションで自分の好みに設定可能
line-length = 120
target-version = "py37"
select = ["E", "F"]  # 基本的なエラーとバグのみを検出

[tool.ruff.per-file-ignores]
# 特定のファイルでルールを無視する設定例（コメントとして残す）
# "tests/*" = ["D", "E501"]

